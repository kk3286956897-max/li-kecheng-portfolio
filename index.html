<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>李科成作品集 · 访问测试</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, "Microsoft YaHei", sans-serif; background: #0d0c0b; color: #f0ece5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1100px, 100%); margin: auto; padding: 36px 24px 64px; }
    header { border-bottom: 1px solid #494039; padding-bottom: 24px; }
    .label { color: #fa8a14; font-size: 12px; letter-spacing: .08em; }
    h1 { font-size: clamp(28px, 5vw, 48px); margin: 14px 0; }
    h2 { margin: 0 0 10px; font-size: 24px; }
    p { color: #bdb6ac; line-height: 1.8; }
    section { margin-top: 36px; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border: 1px solid #494039; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button { min-height: 44px; padding: 10px 16px; border: 1px solid #fa8a14; background: #fa8a14; color: #100d09; font: inherit; font-weight: bold; cursor: pointer; }
    button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    .status { min-height: 28px; margin: 12px 0; font-size: 14px; }
    footer { margin-top: 36px; border-top: 1px solid #494039; padding-top: 16px; }
    @media (max-width: 600px) { main { padding: 24px 16px 40px; } h2 { font-size: 21px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="label">LI KECHENG / NETWORK TEST</div>
      <h1>作品集访问与视频测试</h1>
      <p>请关闭 VPN，分别使用 Wi-Fi 和移动网络打开。此页面用于确认新托管的视频播放能力。</p>
    </header>
    <section>
      <h2>01 · 首页动态视频</h2>
      <p>检查播放、暂停，以及三个阶段之间的进度跳转。首页原视频没有音轨。</p>
      <video id="hero" controls playsinline preload="metadata" poster="hero-poster.jpg" src="hero-web.mp4"></video>
      <div class="actions" aria-label="首页视频阶段">
        <button type="button" data-seek="0">第一阶段</button>
        <button type="button" data-seek="3.03">第二阶段</button>
        <button type="button" data-seek="6.78">第三阶段</button>
      </div>
      <p class="status" id="hero-status" role="status">等待视频信息…</p>
    </section>
    <section>
      <h2>02 · 项目完整影片</h2>
      <p>使用网站中最大的影片文件测试加载。点击播放，确认声音正常，再拖动进度到中段和末尾。</p>
      <video id="film" controls playsinline preload="none" poster="winter-cover.png" src="winter-film.mp4"></video>
      <p class="status" id="film-status" role="status">点击播放后加载影片。</p>
    </section>
    <footer><p>请反馈：网络类型、能否打开、是否能播放、有无声音、进度能否拖动。页面不会收集或上传这些信息。</p></footer>
  </main>
  <script>
    const hero = document.querySelector('#hero');
    document.querySelectorAll('[data-seek]').forEach(button => {
      button.addEventListener('click', () => {
        if (hero.readyState < 1) {
          document.querySelector('#hero-status').textContent = '视频仍在加载，请稍后再切换阶段。';
          hero.load();
          return;
        }
        hero.pause();
        hero.currentTime = Number(button.dataset.seek);
      });
    });
    document.querySelectorAll('video').forEach(video => {
      const status = document.querySelector(`#${video.id}-status`);
      const update = () => {
        if (Number.isFinite(video.duration)) {
          status.textContent = `${video.paused ? '已暂停' : '播放中'} · ${video.currentTime.toFixed(1)} / ${video.duration.toFixed(1)} 秒`;
        }
      };
      ['loadedmetadata', 'play', 'pause', 'seeked', 'timeupdate'].forEach(event => video.addEventListener(event, update));
      video.addEventListener('error', () => { status.textContent = `视频加载失败（代码 ${video.error?.code ?? '未知'}），请反馈此提示。`; });
    });
  </script>
</body>
</html>
